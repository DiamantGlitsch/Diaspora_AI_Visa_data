name: Apply Kenya eTA batch 1

on:
  push:
    branches:
      - kenya-eta-2025-exemptions-batch-1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kenya-eta-2025-exemptions-batch-1
          fetch-depth: 1

      - name: Apply verified Kenya 2025 exemptions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from datetime import datetime, timezone

          DATA = Path('data/passport-requirements')
          TODAY = '2026-10-16'
          ROUTE_UPDATED = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          SOURCE_URL = 'https://etakenya.go.ke/how-to-apply'

          RULES = {
              'MA': ('Morocco', 60, '60'),
              'NG': ('Nigeria', 60, '60'),
              'DZ': ('Algeria', 60, '60'),
              'EG': ('Egypt', 60, '60'),
              'GH': ('Ghana', 90, '90'),
              'ZA': ('South Africa', 90, '90'),
              'ET': ('Ethiopia', 90, '90'),
              'UG': ('Uganda', 180, '180'),
              'TZ': ('Tanzania', 180, '180'),
              'RW': ('Rwanda', 180, '180'),
          }
          ORDER = ['MA','NG','GH','ZA','UG','TZ','RW','DZ','EG','ET']

          QUOTES = {
              '60': 'Nationals of the following African countries for a period not exceeding sixty (60) days－',
              '90': 'Nationals of the following Countries for a period not exceeding ninety (90) days－',
              '180': 'Rwanda, South Sudan, Tanzania and Uganda for a period not exceeding 180 days.',
          }
          PATHS = {
              '60': 'Kenya eTA > How to Apply > Persons exempt from obtaining eTA > item 5 > 60-day African exemption list',
              '90': 'Kenya eTA > How to Apply > Persons exempt from obtaining eTA > item 4 > 90-day exemption list',
              '180': 'Kenya eTA > How to Apply > Persons exempt from obtaining eTA > item 3 > East African Partner States',
          }

          def pretty(obj, prefix):
              return '\n'.join(prefix + line for line in json.dumps(obj, ensure_ascii=False, indent=2).splitlines())

          def replace_once(text, old_obj, new_obj, prefix):
              old = pretty(old_obj, prefix)
              new = pretty(new_obj, prefix)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one exact object match, found {count}')
              return text.replace(old, new, 1)

          def bucket(policy):
              if policy == 'visa_free': return 'visa_free'
              if policy in ('evisa','eta'): return 'evisa'
              if policy in ('voa','visa_on_arrival'): return 'visa_on_arrival'
              if policy == 'visa_required': return 'visa_required'
              raise RuntimeError(f'Unknown policy bucket: {policy}')

          def recompute(routes):
              out = {'visa_free':0,'evisa':0,'visa_on_arrival':0,'visa_required':0,'total':len(routes)}
              for r in routes:
                  out[bucket(r['visa']['policy'])] += 1
              return out

          results = []
          for code in ORDER:
              country, days, group = RULES[code]
              path = DATA / f'{code}.json'
              text = path.read_text(encoding='utf-8')
              doc = json.loads(text)
              route = next((r for r in doc['routes'] if r.get('to',{}).get('code') == 'KE'), None)
              if route is None:
                  raise RuntimeError(f'{code}: Kenya route not found')

              old_route = deepcopy(route)
              old_summary = deepcopy(doc['summary'])
              visa = route['visa']
              visa['required'] = False
              visa['policy'] = 'visa_free'
              if 'type' in visa: visa['type'] = None
              if 'freeDays' in visa: visa['freeDays'] = days
              if 'visaFreeDays' in visa: visa['visaFreeDays'] = days
              if 'maxStay' in visa: visa['maxStay'] = days
              if 'maxStayDays' in visa: visa['maxStayDays'] = days
              if 'evisa' in visa: visa['evisa'] = False
              if 'evisaAvailable' in visa: visa['evisaAvailable'] = False
              if 'onArrival' in visa: visa['onArrival'] = False
              if 'visaOnArrival' in visa: visa['visaOnArrival'] = False
              if 'multipleEntry' in visa: visa['multipleEntry'] = False
              visa['notes'] = f'{country} passport holders are exempt from Kenya eTA under the 2025 rules for a stay not exceeding {days} days.'

              route.setdefault('meta', {})
              route['meta']['confidence'] = 'verified'
              route['meta']['lastChecked'] = TODAY
              route['lastUpdated'] = ROUTE_UPDATED
              route['source'] = {
                  'url': SOURCE_URL,
                  'governmentDomain': True,
                  'accessedDate': TODAY,
                  'verificationPath': PATHS[group] + f' > {country}',
                  'exactQuote': QUOTES[group],
                  'confidence': 'verified',
                  'notes': f'{country} appears in the official {days}-day exemption group on the same Kenya eTA page.'
              }

              new_summary = recompute(doc['routes'])
              new_text = replace_once(text, old_route, route, '    ')
              if old_summary != new_summary:
                  new_text = replace_once(new_text, old_summary, new_summary, '  ')

              check = json.loads(new_text)
              kr = next(r for r in check['routes'] if r['to']['code']=='KE')
              assert kr['visa']['required'] is False
              assert kr['visa']['policy'] == 'visa_free'
              assert kr['source']['governmentDomain'] is True
              assert kr['source']['url'] == SOURCE_URL
              assert check['summary']['total'] == len(check['routes'])
              path.write_text(new_text, encoding='utf-8')
              results.append((code, old_route['visa']['policy'], days))

          print('UPDATED', results)
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          targets=['MA','NG','GH','ZA','UG','TZ','RW','DZ','EG','ET']
          for code in targets:
              p=Path('data/passport-requirements')/f'{code}.json'
              d=json.loads(p.read_text(encoding='utf-8'))
              r=next(x for x in d['routes'] if x['to']['code']=='KE')
              assert r['visa']['policy']=='visa_free' and r['visa']['required'] is False
              assert r['source']['governmentDomain'] is True
              assert r['source']['accessedDate']=='2026-10-16'
          print('JSON/route validation PASS')
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/passport-requirements/{DZ,EG,ET,GH,MA,NG,RW,TZ,UG,ZA}.json | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected changed files'; echo "$changed"; exit 1; }

      - name: Commit data changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'zongsm-cmyk'
          git config user.email 'zongsm-cmyk@users.noreply.github.com'
          rm -f .github/workflows/_apply_kenya_eta_batch1.yml
          git add data/passport-requirements/{MA,NG,GH,ZA,UG,TZ,RW,DZ,EG,ET}.json .github/workflows/_apply_kenya_eta_batch1.yml
          git commit -m 'fix: update Kenya eTA 2025 exemptions batch 1'
          git push origin HEAD:kenya-eta-2025-exemptions-batch-1
