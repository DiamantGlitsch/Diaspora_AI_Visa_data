name: Apply Kenya eTA batch 1

on:
  push:
    branches:
      - kenya-eta-2025-exemptions-batch-1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kenya-eta-2025-exemptions-batch-1
          fetch-depth: 1

      - name: Apply verified Kenya 2025 exemptions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          DATA = Path('data/passport-requirements')
          TODAY = '2026-10-16'
          ROUTE_UPDATED = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          SOURCE_URL = 'https://etakenya.go.ke/how-to-apply'
          RULES = {
              'MA': ('Morocco', 60, '60'), 'NG': ('Nigeria', 60, '60'),
              'DZ': ('Algeria', 60, '60'), 'EG': ('Egypt', 60, '60'),
              'GH': ('Ghana', 90, '90'), 'ZA': ('South Africa', 90, '90'),
              'ET': ('Ethiopia', 90, '90'),
              'UG': ('Uganda', 180, '180'), 'TZ': ('Tanzania', 180, '180'),
              'RW': ('Rwanda', 180, '180'),
          }
          ORDER = ['MA','NG','GH','ZA','UG','TZ','RW','DZ','EG','ET']
          HEADINGS = {
              '60': 'Nationals of the following African countries for a period not exceeding sixty (60) days－',
              '90': 'Nationals of the following Countries for a period not exceeding ninety (90) days－',
              '180': 'Citizens of the East African Partner States: These countries include Burundi, Democratic Republic of Congo, Rwanda, South Sudan, Tanzania and Uganda for a period not exceeding 180 days.',
          }
          PATHS = {
              '60': 'Kenya eTA > How to Apply > Persons exempt from obtaining eTA > item 5 > 60-day African exemption list',
              '90': 'Kenya eTA > How to Apply > Persons exempt from obtaining eTA > item 4 > 90-day exemption list',
              '180': 'Kenya eTA > How to Apply > Persons exempt from obtaining eTA > item 3 > East African Partner States',
          }

          def policy_bucket(policy):
              if policy == 'visa_free': return 'visa_free'
              if policy in ('evisa','eta'): return 'evisa'
              if policy in ('voa','visa_on_arrival'): return 'visa_on_arrival'
              if policy == 'visa_required': return 'visa_required'
              return None

          results=[]
          for code in ORDER:
              country, days, group = RULES[code]
              path = DATA / f'{code}.json'
              doc = json.loads(path.read_text(encoding='utf-8'))
              route = next((r for r in doc['routes'] if r.get('to',{}).get('code') == 'KE'), None)
              if route is None:
                  raise RuntimeError(f'{code}: Kenya route not found')
              visa = route['visa']

              # Idempotence: if the route already carries this verified update, do not touch timestamps.
              if (visa.get('policy') == 'visa_free' and visa.get('required') is False
                  and route.get('source',{}).get('url') == SOURCE_URL
                  and route.get('source',{}).get('accessedDate') == TODAY
                  and (visa.get('freeDays', visa.get('visaFreeDays')) == days)
                  and (visa.get('maxStay', visa.get('maxStayDays')) == days)):
                  results.append((code, 'already-current', days))
                  continue

              old_policy = visa.get('policy')
              visa['required'] = False
              visa['policy'] = 'visa_free'
              if 'type' in visa: visa['type'] = None
              if 'freeDays' in visa: visa['freeDays'] = days
              elif 'visaFreeDays' in visa: visa['visaFreeDays'] = days
              else: visa['freeDays'] = days
              if 'maxStay' in visa: visa['maxStay'] = days
              elif 'maxStayDays' in visa: visa['maxStayDays'] = days
              else: visa['maxStay'] = days
              if 'evisa' in visa: visa['evisa'] = False
              if 'evisaAvailable' in visa: visa['evisaAvailable'] = False
              if 'onArrival' in visa: visa['onArrival'] = False
              if 'visaOnArrival' in visa: visa['visaOnArrival'] = False
              if 'multipleEntry' in visa: visa['multipleEntry'] = False
              visa['notes'] = f'{country} passport holders are exempt from Kenya eTA under the 2025 rules for a stay not exceeding {days} days.'

              route.setdefault('meta', {})
              route['meta']['confidence'] = 'verified'
              route['meta']['lastChecked'] = TODAY
              route['lastUpdated'] = ROUTE_UPDATED
              exact = HEADINGS[group] if group == '180' else f"{HEADINGS[group]} [country entry: {country}]"
              route['source'] = {
                  'url': SOURCE_URL,
                  'governmentDomain': True,
                  'accessedDate': TODAY,
                  'verificationPath': PATHS[group] + f' > {country}',
                  'exactQuote': exact,
                  'confidence': 'verified',
                  'notes': f'{country} is listed under the official {days}-day exemption group on the same Kenya eTA page.'
              }

              if old_policy != 'visa_free':
                  old_bucket = policy_bucket(old_policy)
                  if old_bucket and old_bucket in doc.get('summary',{}):
                      doc['summary'][old_bucket] -= 1
                      doc['summary']['visa_free'] += 1

              if doc.get('summary',{}).get('total') != len(doc['routes']):
                  raise RuntimeError(f'{code}: summary total mismatch before write')
              path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              results.append((code, old_policy, days))

          print('UPDATED', results)
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          expected={'MA':60,'NG':60,'GH':90,'ZA':90,'UG':180,'TZ':180,'RW':180,'DZ':60,'EG':60,'ET':90}
          for code,days in expected.items():
              d=json.loads((Path('data/passport-requirements')/f'{code}.json').read_text(encoding='utf-8'))
              r=next(x for x in d['routes'] if x['to']['code']=='KE')
              v=r['visa']
              assert v['policy']=='visa_free' and v['required'] is False
              assert v.get('freeDays',v.get('visaFreeDays'))==days
              assert v.get('maxStay',v.get('maxStayDays'))==days
              assert r['source']['url']=='https://etakenya.go.ke/how-to-apply'
              assert r['source']['governmentDomain'] is True
              assert r['source']['accessedDate']=='2026-10-16'
              assert d['summary']['total']==len(d['routes'])
          print('JSON/route validation PASS')
          PY

          git diff --check
          changed="$(git diff --name-only -- 'data/passport-requirements/*.json' | sort)"
          expected="$(printf '%s\n' data/passport-requirements/{DZ,EG,ET,GH,MA,NG,RW,TZ,UG,ZA}.json | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected data changes'; echo "$changed"; exit 1; }

      - name: Commit data changes
        shell: bash
        run: |
          if git diff --quiet -- 'data/passport-requirements/*.json'; then
            echo 'No data changes required.'
            exit 0
          fi
          git config user.name 'zongsm-cmyk'
          git config user.email 'zongsm-cmyk@users.noreply.github.com'
          git add data/passport-requirements/{MA,NG,GH,ZA,UG,TZ,RW,DZ,EG,ET}.json
          git commit -m 'fix: update Kenya eTA 2025 exemptions batch 1'
          git push origin HEAD:kenya-eta-2025-exemptions-batch-1
